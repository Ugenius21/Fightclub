<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fightclub">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#16222e">
  <title>Fightclub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-soap-180.png">
  <link rel="icon" href="icon-soap-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back-btn off" aria-label="Zurück"></button>
    <h1 id="title">Fightclub</h1>
    <div id="topAction"></div>
  </header>

  <div id="timerHolder"></div>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="plans" class="active"><span data-ico="training"></span>Training</button>
    <button data-tab="food"><span data-ico="food"></span>Ernährung</button>
    <button data-tab="calendar"><span data-ico="calendar"></span>Kalender</button>
    <button data-tab="progress"><span data-ico="progress"></span>Fortschritt</button>
    <button data-tab="profile"><span data-ico="profile"></span>Profil</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop"></div>
    <div class="sheet-card" id="sheetCard"></div>
  </div>

  <div id="keypad" class="keypad" hidden></div>

  <script src="config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/food.js"></script>
  <script src="js/recipes.js"></script>
  <script src="app.js"></script>
</body>
</html>
