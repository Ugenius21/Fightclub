<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fightclub</title>
  <meta name="theme-color" content="#111114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fightclub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-1024.png">
  <link rel="icon" href="icons/icon-1024.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="topbar-btn" id="back-btn" hidden aria-label="Zurück">‹ Zurück</button>
    <h1 id="title">Fightclub</h1>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <main id="app"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="plans" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 10h2V7h2v10H5v-3H3v-4zm16 0h2v4h-2v3h-2V7h2v3zM8 11h8v2H8z"/></svg>
      <span>Pläne</span>
    </button>
    <button data-tab="calendar">
      <svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3V2zm12 8H5v9h14v-9z"/></svg>
      <span>Kalender</span>
    </button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24"><path d="M3 19h18v2H3zM5 16l4-5 4 3 6-8 1.6 1.2-7.2 9.6-4-3L6.6 17.2z"/></svg>
      <span>Fortschritt</span>
    </button>
    <button data-tab="weight">
      <svg viewBox="0 0 24 24"><path d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm6 3a5 5 0 0 0-4.6 3h2.3a3 3 0 0 1 4.6 0h2.3A5 5 0 0 0 12 7zm-.6 3.2 1.2.6-1 2-1.2-.6z"/></svg>
      <span>Gewicht</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
