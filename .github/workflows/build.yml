name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Version
        run: xcodebuild -version
      - name: App für den Simulator bauen
        run: |
          xcodebuild build \
            -project Fightclub.xcodeproj \
            -scheme Fightclub \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
